# SwiftLint configuration — https://realm.github.io/SwiftLint/rule-directory.html
# Formatting/whitespace is owned by swift-format (.swift-format); rules that
# overlap with it are disabled below so the two tools never disagree.

included:
  - SwiftImmich
  - SwiftImmichTests

excluded:
  - DerivedData
  - build
  - .build

disabled_rules:
  # Handled by swift-format
  - trailing_comma
  - opening_brace
  - closure_parameter_position
  - vertical_whitespace
  - trailing_whitespace
  - line_length
  - statement_position
  - comma
  - colon
  - todo

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - last_where
  - legacy_multiple
  - modifier_order
  - no_extension_access_modifier
  - overridden_super_call
  - prefer_self_in_static_references
  - private_swiftui_state
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

custom_rules:
  no_print:
    name: "No print"
    regex: '\bprint\('
    message: "Use os.Logger instead of print()."
    severity: warning
    excluded: "SwiftImmichTests/.*"

identifier_name:
  excluded: [id, x, y, i, to]

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100
